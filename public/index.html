<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RB Game</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<main>
<header><div id="stats"></div><button id="pause" aria-label="Mettre en pause">Pause</button></header>
<div id="stage">
<div id="directions" class="touch-controls" aria-label="Déplacement">
<button data-key="ArrowLeft" aria-label="Aller à gauche">←</button>
<button data-key="ArrowRight" aria-label="Aller à droite">→</button>
</div>
<canvas id="game" width="960" height="540" tabindex="0" aria-label="Jeu de plateformes : atteindre la porte avec gauche, droite et saut"></canvas>
<div id="jump" class="touch-controls"><button data-key="Space" aria-label="Sauter">↑</button></div>
</div>
<footer><span id="keyboard-help"><kbd>←</kbd> <kbd>→</kbd> bouger &nbsp; <kbd>Espace</kbd> sauter · Échap : pause</span><span id="rotate-hint">Tourne ton téléphone pour jouer plus confortablement.</span><button id="restart">Recommencer</button></footer>
<div id="status" aria-live="polite"></div>
<div id="pause-menu" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
<div class="menu-card">
<h1 id="pause-title">Pause</h1>
<button id="resume">Reprendre</button>
<label for="touch-mode">Commandes tactiles</label>
<select id="touch-mode"><option value="auto">Automatiques</option><option value="show">Afficher</option><option value="hide">Masquer</option></select>
<button id="fullscreen" hidden>Plein écran</button>
<button id="restart-menu">Recommencer la partie</button>
</div>
</div>
</main>
<script src="game.js?v=7"></script>
<script src="controls.js?v=7"></script>
</body>
</html>
