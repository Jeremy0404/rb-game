<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encore un saut</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#eaece5;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(1060px,96vw,calc((100dvh - 155px)*1.7778));padding:14px 0}header{display:flex;align-items:center;justify-content:flex-end;margin-bottom:10px}#stats{font:13px ui-monospace,monospace;color:#b9c1cf;text-align:right;line-height:1.9}canvas{display:block;width:100%;aspect-ratio:960/540;background:#171c27;border:1px solid #353c4a;border-radius:12px;outline:none}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-size:13px;color:#9298a9}kbd{display:inline-block;border:1px solid #454b59;border-bottom-width:3px;border-radius:5px;padding:4px 9px;color:#ecede9;font:12px system-ui}button{background:#252d3b;color:#eaece5;border:1px solid #454b59;border-radius:7px;padding:10px 15px;cursor:pointer}button:hover{background:#354052}#touch{display:flex;gap:10px;margin-top:16px}#touch button{touch-action:none;user-select:none;font-size:22px;min-width:72px}#touch button:last-child{margin-left:auto}#status{min-height:20px;color:#d5ff70;font-size:14px;text-align:center;margin-top:12px}@media(min-width:900px) and (pointer:fine){#touch{display:none}}
</style>
<main><header><div id="stats"></div></header><canvas id="game" width="960" height="540" tabindex="0" aria-label="Jeu de plateformes : flèches gauche et droite, espace pour sauter"></canvas><footer><div><kbd>←</kbd> <kbd>→</kbd> bouger &nbsp; <kbd>Espace</kbd> sauter</div><button id="restart">Recommencer</button></footer><div id="touch"><button data-key="ArrowLeft" aria-label="Reculer">←</button><button data-key="ArrowRight" aria-label="Avancer">→</button><button data-key="Space" aria-label="Sauter">↑</button></div><div id="status" aria-live="polite"></div></main>
<script src="game.js?v=4"></script></html>
