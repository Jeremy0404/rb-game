name: rb-game

services:
  rb-game:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: rb-game
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 32m
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env}
