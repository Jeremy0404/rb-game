name: Feature
description: A feature or an epic. Epics get broken down into sub-issues before delegation.
title: "[feat]: "
labels: ["feature", "needs-refining"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The need, for whom, why now.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable, one per line.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: If this is an epic, note here that it will be split into XS/S sub-issues before delegation.
    validations:
      required: false
